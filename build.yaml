changelog: |-
  Renamed to BetterRecs. Added 'Because you watched ...' personalised recommendation sections, exposed via the /BetterRecs/Recommendations API, with full configuration (section count, items per section, recommend-watched, cross-type movie/series recommendations). Added Home Screen Sections (HSS) integration: when the HSS plugin is installed, BetterRecs registers a single blended 'Recommended for You' row on the home screen, combining matches from several recently-watched titles.
