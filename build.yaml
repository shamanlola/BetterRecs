changelog: |-
  Home Screen Sections (HSS) integration is now functional: BetterRecs registers a single blended 'Recommended for You' row that combines the top matches from several recently-watched titles and rebuilds on every home-screen refresh. Reworked the home-screen settings (row title, items in the row, titles blended, regenerate-on-refresh) to match the single-row model, and removed the cross-type toggle since the blended row already mixes media types via its sources. Fixed the Home Screen Sections plugin link in the docs.
