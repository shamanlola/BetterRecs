changelog: |-
  Added a separate 'Discovery' control for the 'Recommended for You' home row, independent of the global Randomness used by Similar Items. Higher values both shuffle the row's ordering and progressively loosen the matching filters (genre/tag minimums and rating distances), so genuinely more distant titles can surface for broader discovery — without affecting Similar Items.
