description: "Better recommendations for Jellyfin. Replaces the built-in Similar Items with a multi-dimensional weighted scoring engine, and serves personalised 'Because you watched ...' rows via the /BetterRecs/Recommendations API. When the Home Screen Sections (HSS) plugin is installed, it also adds a blended 'Recommended for You' row to the home screen. Matches on genres, tags, community rating, parental rating, release year, and cast/crew. Fully configurable through the dashboard."
